# External Secrets Operator (ESO) wiring example. NO secret values are committed:
# ESO reads them from the external store using the pod's workload identity and
# projects the `multi-agent-commerce-secrets` Secret consumed by the Deployment and
# migration Job. Replace the SecretStore provider block with your platform's config.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: multi-agent-commerce
  labels:
    app: multi-agent-commerce
spec:
  provider:
    # ── Azure Key Vault via workload identity (recommended) ──────────────────
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "https://REPLACE-kv.vault.azure.net"
      serviceAccountRef:
        name: multi-agent-commerce
    # ── AWS Secrets Manager via IRSA (alternative) ───────────────────────────
    #   aws:
    #     service: SecretsManager
    #     region: us-east-1
    #     auth:
    #       jwt:
    #         serviceAccountRef:
    #           name: multi-agent-commerce
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: multi-agent-commerce-secrets
  labels:
    app: multi-agent-commerce
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: multi-agent-commerce
    kind: SecretStore
  target:
    name: multi-agent-commerce-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: datasource-url
      remoteRef:
        key: commerce/datasource-url
    - secretKey: datasource-username
      remoteRef:
        key: commerce/datasource-username
    - secretKey: datasource-password
      remoteRef:
        key: commerce/datasource-password
    - secretKey: redis-password
      remoteRef:
        key: commerce/redis-password
    - secretKey: llm-api-key
      remoteRef:
        key: commerce/llm-api-key
    - secretKey: azure-openai-endpoint
      remoteRef:
        key: commerce/azure-openai-endpoint
    # ── Live adapter credentials (only needed when RUNTIME_TOOLS_MODE=LIVE) ───
    - secretKey: adapter-inventory-client-secret
      remoteRef:
        key: commerce/adapter-inventory-client-secret
    - secretKey: adapter-pricing-client-secret
      remoteRef:
        key: commerce/adapter-pricing-client-secret
    - secretKey: adapter-sentiment-api-key
      remoteRef:
        key: commerce/adapter-sentiment-api-key
