apiVersion: v1
kind: Service
metadata:
  name: multi-agent-commerce
  labels:
    app: multi-agent-commerce
    app.kubernetes.io/name: multi-agent-commerce
    app.kubernetes.io/component: api
spec:
  selector:
    app: multi-agent-commerce
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
    - name: management
      protocol: TCP
      port: 8081
      targetPort: management
