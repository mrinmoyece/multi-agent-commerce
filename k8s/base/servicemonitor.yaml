apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: multi-agent-commerce
  labels:
    app: multi-agent-commerce
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: multi-agent-commerce
  endpoints:
    - port: management
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
      scheme: http
  # No namespaceSelector: the Prometheus Operator defaults to the ServiceMonitor's
  # own namespace, which Kustomize sets per overlay (commerce / commerce-staging /
  # commerce-dev). Hardcoding matchNames here would break scraping in non-prod,
  # since the namespace transformer does not rewrite selector values.
