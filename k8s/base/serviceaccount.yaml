apiVersion: v1
kind: ServiceAccount
metadata:
  name: multi-agent-commerce
  labels:
    app: multi-agent-commerce
    app.kubernetes.io/name: multi-agent-commerce
  # Workload-identity federation. Set the real client/tenant IDs per overlay so
  # the pod obtains cloud credentials (e.g. Azure AD workload identity or an AWS
  # IRSA role) WITHOUT any long-lived secret in the cluster.
  #   annotations:
  #     azure.workload.identity/client-id: "<REPLACE_UUID>"
  #     eks.amazonaws.com/role-arn: "arn:aws:iam::<acct>:role/<role>"
automountServiceAccountToken: false
