apiVersion: v1
kind: ConfigMap
metadata:
  name: multi-agent-commerce-config
  labels:
    app: multi-agent-commerce
# Non-secret runtime configuration only. Connection secrets (datasource
# URL/username/password, redis password, LLM key, Azure endpoint, adapter
# credentials) live in the externally-managed Secret `multi-agent-commerce-secrets`
# projected by External Secrets (see externalsecret.yaml) and are NEVER committed.
data:
  redis-host: "redis.data.svc.cluster.local"
  redis-port: "6379"
  redis-ssl: "false"
  # Replace with the real OIDC issuer and the API's accepted audience(s).
  oauth2-issuer-uri: "https://login.example.com/tenant"
  oauth2-audiences: "api://multi-agent-commerce"
