apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production overlay: highest availability (3+ replicas across zones, HPA to 6),
# live systems of record, tightest resource envelope. The image digest here MUST be
# the exact digest that passed staging — promotion is by digest, never a rebuild.
namespace: commerce

resources:
  - ../../base

images:
  - name: ghcr.io/mrinmoyece/multi-agent-commerce
    newName: ghcr.io/mrinmoyece/multi-agent-commerce
    # Promotion target — set by the release pipeline to the staging-verified digest.
    digest: sha256:3333333333333333333333333333333333333333333333333333333333333333

patches:
  - target:
      kind: Deployment
      name: multi-agent-commerce
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "prod"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RUNTIME_TOOLS_MODE
          value: "LIVE"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "768Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1536Mi"
  - target:
      kind: HorizontalPodAutoscaler
      name: multi-agent-commerce
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 6
  - target:
      kind: PodDisruptionBudget
      name: multi-agent-commerce
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
