services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "--save", ""]
    ports:
      - "127.0.0.1:6379:6379"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
  app:
    build: .
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      LLM_PROVIDER: ${LLM_PROVIDER:-github-models}
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in .env}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      # Persistence + coordination — the dev profile points at these services.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/commerce
      SPRING_DATASOURCE_USERNAME: commerce
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      PLATFORM_REDIS_ENABLED: "true"
      # OAuth2 resource server — validated against a real issuer, no static bypass.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${OAUTH2_ISSUER_URI:?Set OAUTH2_ISSUER_URI in .env}
      PLATFORM_SECURITY_AUDIENCES: ${OAUTH2_AUDIENCE:?Set OAUTH2_AUDIENCE in .env}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  # Opt-in local identity provider. Enabled ONLY with `--profile local-auth`.
  # DEVELOPMENT-ONLY: imports a committed dev realm, publishes on loopback, and
  # never alters the production default (bring-your-own real issuer) path.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858
    profiles: ["local-auth"]
    command: ["start-dev", "--import-realm"]
    environment:
      # Admin bootstrap creds. Overridable via .env; the default is an obvious
      # non-production placeholder. NOTE: a single-file Compose profile still
      # interpolates these variables when the profile is inactive, so a hard
      # `${VAR:?}` requirement here would break the default (bring-your-own-issuer)
      # `docker compose up`. The real client-credentials secret lives in the
      # committed dev realm, not here — the admin account is only for the console.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-dev-admin-not-for-production}
      # Pin the issuer to the in-network URL so the token `iss` is identical
      # whether the app (via compose DNS `keycloak:8080`) or a developer (via the
      # published loopback port) obtains it. This is what makes issuer discovery
      # and signature validation actually work from inside the app container.
      KC_HOSTNAME: http://keycloak:8080
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    security_opt:
      - no-new-privileges:true
  prometheus:
    image: prom/prometheus:v3.7.3@sha256:6573196e5dbe834779ac4d34cb053113cc502a69e9e20ba3be96d37f33e81545
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana:12.3.0@sha256:793c8719b0043ed885d1e75200a62d8adf63f0eae00f6f12b7a98eb7293a525c
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"

volumes:
  postgres-data:
