name: Release

# Secure, digest-pinned release pipeline. Builds a multi-arch image once, signs it
# and its provenance/SBOM with keyless Sigstore (OIDC), scans it, and promotes the
# SAME digest through environment-protected deploy gates. Nothing is ever rebuilt
# between environments — promotion is strictly by digest.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      promote_digest:
        description: "Existing image digest (sha256:...) to promote without rebuilding"
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Default to no permissions; each job opts in to the least it needs.
permissions: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/multi-agent-commerce
  JAVA_VERSION: "21"
  # Pinned, checksum-verified Trivy (see ci.yml for rationale).
  TRIVY_VERSION: "0.73.0"
  TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
  TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1

jobs:
  # ── Gate: full verification must pass before anything is published ──────────
  verify:
    name: Verify (all gates)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Run full verification aggregate
        run: ./gradlew clean check cyclonedxBom --no-daemon
      - name: Upload SBOM (Gradle CycloneDX)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-sbom
          path: build/reports/cyclonedx/
          retention-days: 90

  # ── Build once: multi-arch image + provenance + SBOM + signatures ───────────
  build:
    name: Build, Sign & Attest
    needs: [verify]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write         # keyless Sigstore/Cosign OIDC
      attestations: write     # build provenance attestation
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive version metadata
        id: meta
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image (immutable)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Tag only for humans; deployments always reference the digest below.
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          provenance: true
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        env:
          COSIGN_YES: "true"
        run: cosign sign "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"

      - name: Generate CycloneDX SBOM for the image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: image-sbom.cdx.json

      - name: Attest SBOM to the image (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign attest --type cyclonedx \
            --predicate image-sbom.cdx.json \
            "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install Trivy (pinned, checksum-verified)
        run: |
          set -euo pipefail
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors -o "${asset}" "${base}/${asset}"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors -o trivy_checksums.txt "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${asset}\$" trivy_checksums.txt | sha256sum -c -
          tar -xzf "${asset}" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          rm -f trivy "${asset}" trivy_checksums.txt
          trivy --version
      - name: Scan released image
        run: |
          trivy image --severity CRITICAL,HIGH --ignore-unfixed \
            --exit-code 1 --no-progress "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"

      - name: Write rollback metadata
        run: |
          cat > release-metadata.json <<EOF
          {
            "version": "${{ steps.meta.outputs.version }}",
            "digest": "${{ steps.build.outputs.digest }}",
            "image": "${IMAGE_NAME}",
            "git_sha": "${{ github.sha }}",
            "git_ref": "${{ github.ref_name }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "previous_digest_hint": "See the prior release's release-metadata artifact to roll back by digest."
          }
          EOF
          cat release-metadata.json

      - name: Upload SBOM and rollback metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            image-sbom.cdx.json
            release-metadata.json
          retention-days: 90

  # ── Verify signature + attestations before any deploy is allowed ────────────
  verify-supply-chain:
    name: Verify Signature & Provenance
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify keyless signature
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_NAME}@${{ needs.build.outputs.digest }}"
      - name: Verify SBOM attestation
        run: |
          cosign verify-attestation --type cyclonedx \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_NAME}@${{ needs.build.outputs.digest }}"

  # ── Promotion by digest through environment-protected gates ─────────────────
  deploy-staging:
    name: Promote to Staging
    needs: [build, verify-supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging   # branch/reviewer protection configured on the environment
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pin staging overlay to the released digest
        run: |
          cd k8s/overlays/staging
          kubectl kustomize . >/dev/null   # sanity: overlay renders
          echo "Would set image ${IMAGE_NAME}@${{ needs.build.outputs.digest }} via GitOps."
      - name: Record promotion
        run: echo "Promoted ${{ needs.build.outputs.version }} (${{ needs.build.outputs.digest }}) to staging"

  deploy-prod:
    name: Promote to Production
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production   # manual approval gate configured on the environment
    permissions:
      contents: write   # create the GitHub Release + generate release notes
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pin prod overlay to the staging-verified digest
        run: |
          cd k8s/overlays/prod
          kubectl kustomize . >/dev/null
          echo "Would set image ${IMAGE_NAME}@${{ needs.build.outputs.digest }} via GitOps."
      - name: Publish GitHub Release with provenance note
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          body: |
            Immutable image: `${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}`
            Signed with keyless Sigstore/Cosign; CycloneDX SBOM and SLSA build
            provenance attested to the digest. Promote/rollback strictly by digest.
